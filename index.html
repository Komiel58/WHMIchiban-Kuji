<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>スクラッチくじ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="lottery">
    <div class="top">
      <span>WHM一番くじ</span>
      <b>1回 100円</b>
    </div>
    <h1>削って当てよう！</h1>
    <p class="lead">銀色の部分を指で削ってください</p>
    <div class="arrow">▼</div>
    <section class="scratch-wrap">
      <div class="under">
        <div id="rank">?</div>
        <div id="prize">RESULT</div>
      </div>
      <canvas id="scratch"></canvas>
    </section>
    <div id="hint">指でこすって削る</div>
    <section id="resultBox" class="result-box hidden">
      <div class="result-label">あたり！</div>
      <div id="finalRank"></div>
      <div id="finalPrize"></div>
      <p>この画面を店番に見せてください</p>
      <button id="staffBtn">店番確認</button>
    </section>
    <section id="usedBox" class="used hidden">
      <div class="check">✓</div>
      <h2>景品交換済み</h2>
      <div id="usedText"></div>
      <p id="usedTime"></p>
      <button id="playAgainBtn">次のくじを買う</button>
    </section>
    <div class="bottom">ホワイトハッカーマン 一番くじブース</div>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2>店番確認</h2>
      <p>パスコードを入力してください</p>
      <input id="pass" type="password" inputmode="numeric" placeholder="パスコード">
      <button id="exchangeBtn">景品を渡す</button>
      <button id="cancelBtn" class="cancel">キャンセル</button>
      <p id="error"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
