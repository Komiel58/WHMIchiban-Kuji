<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>スタッフ管理ページ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .staff-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .staff-header {
      background: #ffe600;
      color: #df1649;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 900;
      font-size: 24px;
      box-shadow: 0 4px 0 #d10a3c;
    }

    .section {
      background: #fff;
      color: #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
    }

    .section h2 {
      margin: 0 0 16px;
      font-size: 20px;
      color: #ec1451;
      border-bottom: 2px solid #ec1451;
      padding-bottom: 8px;
    }

    .stock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .stock-item {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .stock-item .rank {
      font-size: 18px;
      font-weight: 700;
      color: #ec1451;
    }

    .stock-item .name {
      font-size: 14px;
      margin: 4px 0;
    }

    .stock-item .count {
      font-size: 24px;
      font-weight: 900;
      color: #333;
      margin: 8px 0;
    }

    .stock-item .stock-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .stock-item .stock-controls button {
      width: 32px;
      height: 32px;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      background: #ec1451;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 0 #a70b35;
    }

    .stock-item .stock-controls button:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .stock-item .stock-controls button.minus {
      background: #666;
      box-shadow: 0 2px 0 #444;
    }

    .stock-item .stock-controls button.minus:active {
      box-shadow: none;
    }

    .stock-item.out-of-stock {
      background: #ffe6e6;
    }

    .stock-item.out-of-stock .count {
      color: #d00;
    }

    .history-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item .result {
      font-weight: 700;
      color: #ec1451;
    }

    .history-item .time {
      font-size: 12px;
      color: #666;
    }

    .empty-message {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .button-group button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: #ec1451;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #a70b35;
    }

    .button-group button:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .button-group button.secondary {
      background: #999;
      box-shadow: 0 4px 0 #666;
    }

    .button-group button.secondary:active {
      box-shadow: none;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #ec1451;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      box-shadow: 0 4px 0 #a70b35;
    }

    .back-link:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .edit-mode-bar {
      background: #ffe600;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .edit-mode-bar .status {
      font-weight: 700;
      color: #df1649;
    }

    .edit-mode-bar button {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: #ec1451;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 0 #a70b35;
    }

    .edit-mode-bar button:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .edit-mode-bar button.save {
      background: #28a745;
      box-shadow: 0 2px 0 #1e7e34;
    }

    .edit-mode-bar button.save:active {
      box-shadow: none;
    }

    .edit-mode-bar button.cancel {
      background: #999;
      box-shadow: 0 2px 0 #666;
    }

    .edit-mode-bar button.cancel:active {
      box-shadow: none;
    }

    .stock-item .stock-controls {
      display: none;
    }

    .edit-mode .stock-item .stock-controls {
      display: flex;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="staff-container">
    <div class="staff-header">
      スタッフ管理ページ
    </div>

    <div id="loginSection" class="section">
      <h2>認証</h2>
      <p>パスコードを入力してください</p>
      <input id="staffPass" type="password" inputmode="numeric" placeholder="パスコード" style="width: 100%; padding: 12px; margin: 12px 0; font-size: 18px; text-align: center; border: 2px solid #ddd; border-radius: 8px;">
      <button id="loginBtn" style="width: 100%; padding: 12px; font-size: 16px; font-weight: 700; color: #fff; background: #ec1451; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 0 #a70b35;">ログイン</button>
      <p id="loginError" style="margin-top: 12px; color: #d00; font-weight: 700;"></p>
    </div>

    <div id="dashboardSection" class="hidden">
      <div class="section">
        <h2>在庫状況</h2>
        <div id="editModeBar" class="edit-mode-bar hidden">
          <span class="status">編集モード中</span>
          <div style="display: flex; gap: 8px;">
            <button id="cancelEditBtn" class="cancel">キャンセル</button>
            <button id="saveStockBtn" class="save">保存</button>
          </div>
        </div>
        <div id="stockGrid" class="stock-grid"></div>
        <div class="button-group">
          <button id="editStockBtn">在庫を編集</button>
        </div>
      </div>

      <div class="section">
        <h2>販売履歴</h2>
        <div id="historyList" class="history-list"></div>
        <div class="button-group">
          <button id="clearHistoryBtn">履歴をクリア</button>
        </div>
      </div>

      <div class="section">
        <h2>在庫リセット</h2>
        <p>在庫を初期値に戻します</p>
        <div class="button-group">
          <button id="resetStockBtn" class="secondary">在庫をリセット</button>
        </div>
      </div>

      <div class="button-group">
        <button id="logoutBtn" class="secondary">ログアウト</button>
      </div>

      <a href="index.html" class="back-link">くじページに戻る</a>
    </div>
  </div>

  <script>
    const STAFF_PASSWORD = '1234';
    let isEditMode = false;
    let tempStock = [];

    function getStock() {
      const stored = localStorage.getItem('lotteryStock');
      return stored ? JSON.parse(stored) : [];
    }

    function getSalesHistory() {
      const stored = localStorage.getItem('lotterySalesHistory');
      return stored ? JSON.parse(stored) : [];
    }

    function resetStock() {
      const prizes = [
        { rank: '1等', name: 'ぬいぐるみ', count: 1 },
        { rank: '2等', name: 'アクリルスタンド', count: 10 },
        { rank: '3等', name: 'キーホルダー', count: 20 },
        { rank: '4等', name: 'ステッカー', count: 30 },
        { rank: '5等', name: 'バッチ', count: 50 }
      ];
      const initialStock = prizes.map(p => ({ rank: p.rank, name: p.name, count: p.count }));
      localStorage.setItem('lotteryStock', JSON.stringify(initialStock));
      renderStock();
    }

    function clearHistory() {
      localStorage.removeItem('lotterySalesHistory');
      renderHistory();
    }

    function renderStock() {
      const stock = isEditMode ? tempStock : getStock();
      const grid = document.getElementById('stockGrid');
      grid.innerHTML = '';

      stock.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'stock-item' + (item.count === 0 ? ' out-of-stock' : '');
        div.innerHTML = `
          <div class="rank">${item.rank}</div>
          <div class="name">${item.name}</div>
          <div class="count">${item.count}</div>
          <div class="stock-controls">
            <button class="minus" onclick="adjustStock(${index}, -1)">-</button>
            <button onclick="adjustStock(${index}, 1)">+</button>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function adjustStock(index, delta) {
      tempStock[index].count += delta;
      if (tempStock[index].count < 0) {
        tempStock[index].count = 0;
      }
      renderStock();
    }

    function enterEditMode() {
      isEditMode = true;
      tempStock = JSON.parse(JSON.stringify(getStock()));
      document.getElementById('editModeBar').classList.remove('hidden');
      document.getElementById('editStockBtn').classList.add('hidden');
      document.getElementById('stockGrid').classList.add('edit-mode');
      renderStock();
    }

    function exitEditMode(save) {
      if (save) {
        localStorage.setItem('lotteryStock', JSON.stringify(tempStock));
      }
      isEditMode = false;
      tempStock = [];
      document.getElementById('editModeBar').classList.add('hidden');
      document.getElementById('editStockBtn').classList.remove('hidden');
      document.getElementById('stockGrid').classList.remove('edit-mode');
      renderStock();
    }

    function renderHistory() {
      const history = getSalesHistory();
      const list = document.getElementById('historyList');
      list.innerHTML = '';

      if (history.length === 0) {
        list.innerHTML = '<div class="empty-message">販売履歴はありません</div>';
        return;
      }

      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div class="result">${item.rank} ${item.name}</div>
          <div class="time">${item.timestamp}</div>
        `;
        list.appendChild(div);
      });
    }

    document.getElementById('loginBtn').onclick = () => {
      const pass = document.getElementById('staffPass').value;
      if (pass !== STAFF_PASSWORD) {
        document.getElementById('loginError').textContent = 'パスコードが違います';
        return;
      }
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      renderStock();
      renderHistory();
    };

    document.getElementById('logoutBtn').onclick = () => {
      document.getElementById('staffPass').value = '';
      document.getElementById('loginError').textContent = '';
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    };

    document.getElementById('clearHistoryBtn').onclick = () => {
      if (confirm('販売履歴をクリアしますか？')) {
        clearHistory();
      }
    };

    document.getElementById('resetStockBtn').onclick = () => {
      if (confirm('在庫を初期値にリセットしますか？')) {
        resetStock();
      }
    };

    document.getElementById('editStockBtn').onclick = () => {
      enterEditMode();
    };

    document.getElementById('saveStockBtn').onclick = () => {
      exitEditMode(true);
    };

    document.getElementById('cancelEditBtn').onclick = () => {
      if (confirm('編集内容を破棄しますか？')) {
        exitEditMode(false);
      }
    };
  </script>
</body>
</html>
